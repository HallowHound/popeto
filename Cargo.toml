[package]
name = "popeto"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
png = "0.17"
roxmltree = "0.20"
jpeg-decoder = { version = "0.3", default-features = false }
image-webp = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_Media_Audio",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Security",
  "Win32_UI_Controls",
  "Win32_Globalization",
  "Win32_UI_Controls_Dialogs",
  "Win32_System_DataExchange",
  "Win32_Networking_WinHttp",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
